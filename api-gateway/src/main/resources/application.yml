server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: flight-service
          uri: ${FLIGHT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/flights/**
        - id: crew-service
          uri: ${CREW_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/crew-members/**
        - id: operations-service
          uri: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/flight-operations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
