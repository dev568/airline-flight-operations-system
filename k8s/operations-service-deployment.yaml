apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-service
  namespace: airline-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operations-service
  template:
    metadata:
      labels:
        app: operations-service
    spec:
      containers:
      - name: operations-service
        image: airline-operations-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: airline-config
              key: OPERATIONS_DB_URL
        - name: DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: airline-config
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airline-secrets
              key: DB_PASSWORD
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
