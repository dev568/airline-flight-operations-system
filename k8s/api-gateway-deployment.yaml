apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: airline-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: airline-api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: FLIGHT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airline-config
              key: FLIGHT_SERVICE_URL
        - name: CREW_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airline-config
              key: CREW_SERVICE_URL
        - name: OPERATIONS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: airline-config
              key: OPERATIONS_SERVICE_URL
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
